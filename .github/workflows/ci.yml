name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Shared helpers and the React app: no database involved, so this job is quick and runs alongside the other.
  frontend-and-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shared tests (money, dates, permissions)
        run: npm test --workspace shared
      - name: Client tests
        run: npm test --workspace client
      - name: Build the client
        run: npm run build

  # The API tests talk to the real Neon test branch. They wipe and re-seed it, so only one run
  # may use it at a time. GitHub's servers are far from Neon (Singapore), so every query is slower
  # than on a developer machine: the files run in parallel and the limit is generous.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ledgernepal-test-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Server tests
        run: npm test --workspace server
        env:
          # Repository secret pointing at the Neon *test* branch. Never the real database.
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          # The random bookkeeping test replays a new random sequence each run (the seed is printed on failure).
          # Fewer steps than a developer run because every query is slower from GitHub's servers.
          LEDGER_FUZZ_STEPS: 60
