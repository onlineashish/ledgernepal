name: CI

on:
  pull_request:
  push:
    branches: [main]

# Tests share one Neon test database and wipe/seed it, so only one run may use it at a time.
concurrency:
  group: ledgernepal-test-database
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run all tests (shared, server, client)
        run: npm test
        env:
          # Repository secret pointing at the Neon *test* branch. Never the real database.
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Build the client
        run: npm run build
